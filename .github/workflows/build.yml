# Build the web app (Kotlin/Wasm) on every push, and publish main to GitHub Pages.
name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The design comes from the website repo: tokens, the component list,
      # icons and the checker. Build with the latest, and fail if the app no
      # longer implements it (a missing component, a colour taken directly,
      # a hand-written size). The Design sync workflow commits the copies.
      - name: Design from the website
        run: |
          pip install -q svgelements
          tools/sync_design.sh 2>&1 | tee design.log || { grep -E "^(missing|colour|contrast|unlisted|designsystem|composeApp)" design.log | head -30 | sed 's/^/::error::/'; exit 1; }
          git diff --stat -- design tools designsystem | tail -1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build web app
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache :composeApp:wasmJsBrowserDistribution 2>&1 | tee build.log
      - name: Stamp the build (always load the newest version)
        run: |
          D=composeApp/build/dist/wasmJs/productionExecutable
          B="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$B/g" "$D/index.html" "$D/planner.html"
          printf '{"build":"%s"}\n' "$B" > "$D/version.json"
          # Start the app's .wasm downloads with the page, not after composeApp.js
          # has loaded and asked for them (CI checks each is still fetched once).
          links=$(cd "$D" && for w in *.wasm; do printf '<link rel="preload" href="%s" as="fetch" type="application/wasm" crossorigin>' "$w"; done)
          sed -i "s#</head>#  $links\n</head>#" "$D/index.html" "$D/planner.html"
          # Every file of this build, for the service worker to keep on the phone.
          (cd "$D" && find . -type f ! -name version.json ! -name files.json ! -name sw.js ! -name '*.map' | sed 's#^\./##' | sort | python3 -c 'import json,sys; print(json.dumps({"build": sys.argv[1], "files": [l.strip() for l in sys.stdin if l.strip()]}))' "$B" > files.json)
          echo "::notice::files.json lists $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["files"]))' "$D/files.json") files, $(du -sh $D | cut -f1)"
          echo "::notice::Built $B: $(ls $D | tr '\n' ' ')"
      - name: Report compile errors
        if: failure()
        run: |
          # Kotlin errors as annotations, so they're readable without the log.
          grep -E '^e: ' build.log | head -40 | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\1,line=\2,col=\3::\4#' || true
          grep -A8 'What went wrong' build.log | head -20 | sed 's/^/::error::/' || true
      # The app opened in a real browser: screenshots, timing, and checks that
      # must hold (the routine taps through, offline, updates, planner, 60fps
      # scrolling). A failed check fails the build, so it isn't released.
      - name: Screenshots and checks
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save playwright@1.56.1 > screens.log 2>&1
          node tools/ci/screens.mjs composeApp/build/dist/wasmJs/productionExecutable ci-screens > screens.log 2>&1 || { grep '^::error::' screens.log || tail -25 screens.log | sed 's/^/::error::/'; exit 1; }
          grep -c '"failures": \[\]' ci-screens/report.json > /dev/null && echo "All checks passed"
      - name: Publish screenshots to the ci-screens branch
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          cd ci-screens
          git init -q -b ci-screens
          git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Screens for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screens
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Asks the device lab (Samwisee/device-lab) to test this deploy on the
      # phones and browsers plugged into it, now. Needs the secret
      # DEVICE_LAB_TOKEN; without it the lab still finds the build within
      # ten minutes.
      - name: Tell the device lab
        env:
          TOKEN: ${{ secrets.DEVICE_LAB_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "No DEVICE_LAB_TOKEN: the lab will find this build on its own"; exit 0; }
          curl -fsS -X POST https://api.github.com/repos/Samwisee/device-lab/dispatches \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"test\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"sha\":\"$GITHUB_SHA\"}}" \
            || echo "::warning::Couldn't reach the device lab; it will find this build on its own"
