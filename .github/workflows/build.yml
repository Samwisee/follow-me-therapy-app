# Build the web app (Kotlin/Wasm) on every push, and publish main to GitHub Pages.
name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Design tokens are up to date
        run: |
          python3 tools/gen_tokens.py
          git diff --exit-code -- designsystem/src/commonMain/kotlin/au/com/followmetherapy/design/tokens || (echo "::error::FmtTokens.kt is stale: run python3 tools/gen_tokens.py and commit"; exit 1)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web app
        run: ./gradlew --no-configuration-cache :composeApp:wasmJsBrowserDistribution --stacktrace
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
