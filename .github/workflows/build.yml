# Build the web app (Kotlin/Wasm) on every push, and publish main to GitHub Pages.
name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Design tokens are up to date
        run: |
          python3 tools/gen_tokens.py
          git diff --exit-code -- designsystem/src/commonMain/kotlin/au/com/followmetherapy/design/tokens || (echo "::error::FmtTokens.kt is stale: run python3 tools/gen_tokens.py and commit"; exit 1)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build web app
        run: |
          set -o pipefail
          ./gradlew --no-configuration-cache :composeApp:wasmJsBrowserDistribution 2>&1 | tee build.log
      - name: Stamp the build (always load the newest version)
        run: |
          D=composeApp/build/dist/wasmJs/productionExecutable
          B="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$B/g" "$D/index.html"
          printf '{"build":"%s"}\n' "$B" > "$D/version.json"
          echo "::notice::Built $B: $(ls $D | tr '\n' ' ')"
      - name: Report compile errors
        if: failure()
        run: |
          # Kotlin errors as annotations, so they're readable without the log.
          grep -E '^e: ' build.log | head -40 | sed -E 's#^e: file://([^:]+):([0-9]+):([0-9]+) (.*)#::error file=\1,line=\2,col=\3::\4#' || true
          grep -A8 'What went wrong' build.log | head -20 | sed 's/^/::error::/' || true
      - name: Screenshots and scroll timing
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save playwright@1.56.1 &&
            node tools/ci/screens.mjs composeApp/build/dist/wasmJs/productionExecutable ci-screens
          } > screens.log 2>&1 || { tail -25 screens.log | sed 's/^/::warning::/'; exit 1; }
          tail -5 screens.log
      - name: Publish screenshots to the ci-screens branch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          cd ci-screens
          git init -q -b ci-screens
          git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "Screens for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screens
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
