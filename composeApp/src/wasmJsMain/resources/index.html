<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Follow Me Therapy · Activities</title>
  <!-- Colours here are stamped from the tokens (component.bar.fill) by tools/gen_tokens.py. -->
  <meta name="theme-color" content="#efe9ff" data-token="bar-fill" />
  <!-- Installable: a Home Screen app on phones, tablets and computers. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Follow Me" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <style>
    html, body { height: 100%; margin: 0; background: /* token:bar-fill */ #efe9ff; overscroll-behavior: none; }
    /* From the Home Screen the page runs edge to edge: keep clear of the notch and
       the sides; the bottom edge (home indicator) is handled by the app's bars. */
    #app { box-sizing: border-box; width: 100%; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
    /* Opening: the logo with the practice name on the bars' lilac while the app loads, breathing gently;
       when the app has drawn its first screen it fades away as the app rises in.
       Timings are the motion tokens dur-slow (400ms) and ease-out. */
    #splash { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; background: /* token:bar-fill */ #efe9ff; transition: opacity 400ms cubic-bezier(0.22, 1, 0.36, 1); }
    #splash img { width: min(320px, 76vw); height: auto; animation: fmt-breathe 2.4s ease-in-out infinite; }
    #splash > div { display: grid; justify-items: center; gap: 16px; }
    #splash p { margin: 0; font: 600 17px/1.4 system-ui, -apple-system, sans-serif; color: /* token:ink */ #2b2540; text-align: center; }
    #splash button { min-height: 44px; padding: 8px 28px; border: 2px solid /* token:button-purple-line */ #502eed; border-radius: 999px; background: /* token:button-outline-fill */ #ffffff; color: /* token:button-purple-outline-ink */ #502eed; font: 600 17px system-ui, -apple-system, sans-serif; }
    #splash [hidden] { display: none; }
    #splash.is-done { opacity: 0; pointer-events: none; }
    @keyframes fmt-breathe { 50% { transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { #splash img { animation: none; } #splash { transition-duration: 1ms; } }
  </style>
  <script>
    // Opens from the phone's copy, at once (see sw.js: one worker keeps whole
    // builds). The page tells it the newest build (version.json, never cached);
    // it downloads in the background and is used from the next launch.
    window.FMT_BUILD = "__BUILD__";
    (function () {
      var js = document.createElement("script");
      js.src = "composeApp.js?v=" + window.FMT_BUILD;
      document.head.appendChild(js);
      if (window.FMT_BUILD.indexOf("__") === 0 || !("serviceWorker" in navigator)) return; // local dev, or no workers
      var sw = navigator.serviceWorker;
      sw.register("sw.js").then(function () { return sw.ready; }).then(function (reg) {
        return fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (v) {
          if (v.build && reg.active) reg.active.postMessage({ type: "fmt-newest", build: v.build });
        });
      }).catch(function () {});
    })();
    // Chrome and Edge offer a one-tap install; keep the offer for the app's Install now button.
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.fmtInstallPrompt = e; });
    window.addEventListener("appinstalled", function () { window.fmtInstallPrompt = null; });
  </script>
</head>
<body>
  <div id="splash"><div>
    <img src="icons/lockup-stacked.svg" alt="Follow Me Therapy" />
    <p id="splash-slow" hidden>Still loading. A slow connection can take a little longer.</p>
    <button id="splash-retry" type="button" hidden onclick="location.reload()">Try again</button>
  </div></div>
  <div id="app"></div>
  <script>
    window.fmtReady = function () {
      var s = document.getElementById("splash");
      if (!s) return;
      s.classList.add("is-done");
      setTimeout(function () { s.remove(); }, 600);
    };
    // Never a blank page: if loading is slow or fails, say so and offer to try again
    // (the splash stays until the app has drawn its first screen).
    function fmtStuck(msg) {
      if (!document.getElementById("splash") || document.getElementById("splash").classList.contains("is-done")) return;
      var p = document.getElementById("splash-slow");
      if (msg) p.textContent = msg;
      p.hidden = false;
      document.getElementById("splash-retry").hidden = false;
    }
    setTimeout(function () { fmtStuck(); }, 12000);
    window.addEventListener("error", function () { fmtStuck("Something went wrong while opening. Try again?"); });
    window.addEventListener("unhandledrejection", function () { fmtStuck("Something went wrong while opening. Try again?"); });
  </script>
</body>
</html>
