<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Follow Me Therapy · Activities</title>
  <!-- Colours here are stamped from the tokens (component.bar.fill) by tools/gen_tokens.py. -->
  <meta name="theme-color" content="#efe9ff" data-token="bar-fill" />
  <!-- Installable: a Home Screen app on phones, tablets and computers. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Follow Me" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <style>
    html, body { height: 100%; margin: 0; background: /* token:bar-fill */ #efe9ff; overscroll-behavior: none; }
    /* From the Home Screen the page runs edge to edge: keep clear of the notch and
       the sides; the bottom edge (home indicator) is handled by the app's bars. */
    #app { box-sizing: border-box; width: 100%; height: 100%; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  </style>
  <script>
    // Always the newest build. GitHub Pages lets browsers keep files for ten
    // minutes, so the page checks a version file that is never cached; if a
    // newer build is live it reloads under a fresh address (?v=<build>).
    window.FMT_BUILD = "__BUILD__";
    (function () {
      if (window.FMT_BUILD.indexOf("__") === 0) return; // local dev
      fetch("version.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (v) {
          if (!v.build || v.build === window.FMT_BUILD) return;
          var u = new URL(location.href);
          if (u.searchParams.get("v") === v.build) return;
          u.searchParams.set("v", v.build);
          location.replace(u.toString());
        })
        .catch(function () {});
      // Works without the internet: the service worker keeps the last copy of
      // each file it fetched (always asking the network first), one cache per build.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js?v=" + window.FMT_BUILD).catch(function () {});
      }
    })();
    // Chrome and Edge offer a one-tap install; keep the offer for the app's Install now button.
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.fmtInstallPrompt = e; });
    window.addEventListener("appinstalled", function () { window.fmtInstallPrompt = null; });
  </script>
  <script type="application/javascript" src="composeApp.js?v=__BUILD__"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
